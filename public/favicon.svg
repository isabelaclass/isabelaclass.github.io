<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 2 500 500">
	<!-- Mesmo grafo do hero, com traços e nós menores engrossados para ficar legível em 16px -->
	<style>
		@media (prefers-color-scheme: dark) {
			.ink-stroke { stroke: #FFE9F2; }
			.ink-fill { fill: #FFE9F2; }
			.ring { fill: #2B1026; stroke: #FFE9F2; }
		}
	</style>
	<g class="ink-stroke" fill="none" stroke="#2B1026" stroke-width="18" stroke-linecap="round">
		<line x1="250" y1="230" x2="95" y2="120" />
		<line x1="250" y1="230" x2="410" y2="95" />
		<line x1="250" y1="230" x2="455" y2="300" />
		<line x1="250" y1="230" x2="330" y2="420" />
		<line x1="250" y1="230" x2="110" y2="370" />
		<line x1="95" y1="120" x2="40" y2="250" />
		<line x1="95" y1="120" x2="215" y2="45" />
		<line x1="410" y1="95" x2="215" y2="45" />
		<line x1="410" y1="95" x2="500" y2="190" />
		<line x1="455" y1="300" x2="500" y2="190" />
		<line x1="455" y1="300" x2="330" y2="420" />
		<line x1="110" y1="370" x2="40" y2="250" />
		<line x1="330" y1="420" x2="225" y2="462" />
	</g>
	<circle cx="250" cy="230" r="86" fill="#FF4F9A" />
	<circle cx="95" cy="120" r="40" fill="#C2185B" />
	<circle cx="410" cy="95" r="48" fill="#FF7A2F" />
	<circle class="ink-fill" cx="455" cy="300" r="34" fill="#2B1026" />
	<circle class="ring" cx="330" cy="420" r="38" fill="#FFFFFF" stroke="#2B1026" stroke-width="18" />
	<circle class="ink-fill" cx="110" cy="370" r="30" fill="#2B1026" />
	<circle class="ring" cx="40" cy="250" r="22" fill="#FFFFFF" stroke="#2B1026" stroke-width="16" />
	<circle cx="500" cy="190" r="26" fill="#C2185B" />
	<circle class="ring" cx="215" cy="45" r="24" fill="#FFFFFF" stroke="#2B1026" stroke-width="16" />
	<circle cx="225" cy="462" r="24" fill="#FF7A2F" />
</svg>
